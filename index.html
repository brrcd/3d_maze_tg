<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Maze for Telegram</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>


<body>
  <div id="start-screen" class="screen">
  </div>

  <div id="joystick-container">
    <div id="left-joystick" class="joystick">
      <div class="joystick-area"></div>
      <div class="joystick-thumb"></div>
    </div>

    <div id="right-joystick" class="joystick">
      <div class="joystick-area"></div>
      <div class="joystick-thumb"></div>
    </div>
  </div>
  <div id="action-button"></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/FBXLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/EffectComposer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/RenderPass.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/ShaderPass.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/shaders/CopyShader.min.js"></script>
  <div id="unmute-btn" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 15px;
  background: rgba(0,0,0,0.5);
  color: white;
  border-radius: 5px;
  z-index: 1000;
  display: none;
">Включить звук</div>

<script>
  // Показываем кнопку на iOS
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    document.getElementById('unmute-btn').style.display = 'block';
    
    document.getElementById('unmute-btn').addEventListener('click', function() {
      // Создаем и сразу останавливаем пустой звук
      const context = new (window.AudioContext || window.webkitAudioContext)();
      const source = context.createBufferSource();
      source.buffer = context.createBuffer(1, 1, 22050);
      source.connect(context.destination);
      source.start(0);
      source.stop(0.1);
      
      // Запускаем звук игры
      if (window.audioSystem) {
        audioSystem.sound.context.resume();
        audioSystem.ambientMusic.tracks['room'].play();
      }
      
      this.textContent = 'Звук включен!';
      setTimeout(() => this.style.display = 'none', 2000);
    });
  }
</script>
  <script src="script.js"></script>
</body>

</html>
